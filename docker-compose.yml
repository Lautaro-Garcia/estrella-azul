services:
  estrella-azul:
    build:
      context: .
      dockerfile: Dockerfile
    image: estrella-azul:latest
    container_name: estrella-azul
    ports:
      - "3100:3100"
    environment:
      # Se puede overridear con el .env o inline
      #   PASSWORD=super-secret docker compose up -d
      PASSWORD: ${PASSWORD:-password}
    volumes:
      # Para cambiar las slides sin tener que re-buildear la imagen
      - ./slides:/app/slides:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3100"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
